<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>H₂S-Track — Scan. Track. Protect.</title>
<script src="https://cdn.jsdelivr.net/npm/@alpinejs/[email protected]/dist/cdn.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/[email protected]/dist/cdn.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdn.jsdelivr.net/npm/[email protected]"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Inter','sans-serif'],
          display: ['Manrope','sans-serif'],
        },
        colors: {
          ink: '#1C1E21',
          paper: '#F7F8FA',
          line: '#E3E4E8',
          yellow: { DEFAULT:'#F0C419', 700:'#B8930A', 900:'#5C4A08' },
          amber: { 50:'#F7F0E4', 100:'#EFE3D0', 200:'#DDC49B', 300:'#C79F62', 400:'#A9793F', 500:'#8A5A2A', 600:'#6B441F', 700:'#4A2E15' },
          go: { DEFAULT:'#2F9E52', bg:'#E8F5EC' },
          warn: { DEFAULT:'#D97F13', bg:'#FCF0DF' },
          bad: { DEFAULT:'#C6402B', bg:'#FBEAE7' },
        },
        boxShadow: { card: '0 1px 2px rgba(28,30,33,0.04), 0 1px 1px rgba(28,30,33,0.03)' }
      }
    }
  }
</script>
<style>
  html,body{background:#F7F8FA;color:#1C1E21;}
  .font-display{font-family:'Manrope',sans-serif;}
  .track-underline{
    height:4px; border-radius:2px;
    background: linear-gradient(90deg, #F0C419 0%, #F0C419 60%, transparent 60%);
    width:56px;
  }
  ::-webkit-scrollbar{width:0;height:0;}
  [x-cloak]{display:none!important;}
  .num-tabular{ font-variant-numeric: tabular-nums; }
  .scan-frame{
    border: 2px solid rgba(240,196,25,0.9);
    border-radius: 18px;
    box-shadow: 0 0 0 4000px rgba(10,10,12,0.55);
  }
  .corner{position:absolute;width:22px;height:22px;border-color:#F0C419;}
  .grain-band{
    background-image: repeating-linear-gradient(90deg, rgba(28,30,33,0.05) 0 1px, transparent 1px 24px);
  }
</style>
</head>
<body class="antialiased">

<div x-data="app()" x-init="init()" x-cloak class="min-h-screen">

  <!-- ============ LANDING ============ -->
  <template x-if="view==='landing'">
    <div class="bg-paper">
      <!-- Nav -->
      <header class="max-w-6xl mx-auto flex items-center justify-between px-6 py-6">
        <div class="flex items-center gap-2.5">
          <svg width="30" height="30" viewBox="0 0 30 30"><path d="M3 21 Q 10 9, 15 15 T 27 9" stroke="#F0C419" stroke-width="3.4" fill="none" stroke-linecap="round"/></svg>
          <span class="font-display font-extrabold text-lg tracking-tight">H₂S-Track</span>
        </div>
        <nav class="hidden md:flex items-center gap-8 text-sm font-medium text-ink/70">
          <a href="#how" class="hover:text-ink">How it works</a>
          <a href="#why" class="hover:text-ink">Why H₂S-Track</a>
          <button @click="view='login'" class="text-ink">Sign in</button>
        </nav>
        <button @click="view='home'" class="hidden md:inline-flex items-center rounded-lg bg-ink text-white text-sm font-semibold px-4 py-2.5 hover:bg-black transition">View demo</button>
      </header>

      <!-- Hero -->
      <section class="max-w-6xl mx-auto px-6 pt-8 pb-20 grid md:grid-cols-2 gap-12 items-center">
        <div>
          <p class="text-xs font-semibold tracking-wide text-amber-500 mb-4">PASSIVE DOSIMETRY, DIGITALLY READ</p>
          <h1 class="font-display font-extrabold text-[2.6rem] leading-[1.05] tracking-tight">Passive H₂S exposure.<br>Digitally measured.</h1>
          <div class="track-underline mt-5 mb-6"></div>
          <p class="text-ink/70 text-lg leading-relaxed max-w-md">A battery-free passive dosimeter with smartphone-based quantitative reading for cumulative hydrogen sulfide exposure.</p>
          <div class="flex flex-wrap gap-3 mt-8">
            <button @click="view='scan'" class="inline-flex items-center gap-2 rounded-lg bg-yellow-DEFAULT text-ink font-semibold px-5 py-3 hover:brightness-95 transition">
              <i data-lucide="scan-line" class="w-4 h-4"></i> Scan a badge
            </button>
            <a href="#how" class="inline-flex items-center gap-2 rounded-lg border border-line bg-white px-5 py-3 font-semibold hover:bg-black/[0.02] transition">Learn how it works</a>
          </div>
        </div>
        <!-- Wristband visual -->
        <div class="relative flex justify-center">
          <svg viewBox="0 0 340 240" class="w-full max-w-sm">
            <path d="M40 120 C 40 50, 300 50, 300 120 C 300 190, 40 190, 40 120 Z" fill="#F0C419"/>
            <rect x="100" y="72" width="140" height="96" rx="14" fill="white" stroke="#1C1E21" stroke-width="1.5"/>
            <rect x="112" y="84" width="116" height="26" rx="4" fill="#E1F0E5" stroke="#5E6B56"/>
            <rect x="114" y="86" width="22" height="22" fill="#E1F0E5"/>
            <rect x="136" y="86" width="22" height="22" fill="#B5C4AA"/>
            <rect x="158" y="86" width="22" height="22" fill="#8C846D"/>
            <rect x="180" y="86" width="22" height="22" fill="#595244"/>
            <rect x="202" y="86" width="22" height="22" fill="#262420"/>
            <circle cx="150" cy="132" r="13" fill="#2F9E52" stroke="#1C1E21" stroke-width="1.2"/>
            <rect x="176" y="120" width="38" height="24" rx="3" fill="#1C1E21"/>
            <rect x="181" y="125" width="6" height="6" fill="white"/><rect x="189" y="125" width="6" height="6" fill="white"/><rect x="197" y="125" width="6" height="6" fill="white"/>
            <rect x="181" y="133" width="6" height="6" fill="white"/><rect x="197" y="133" width="6" height="6" fill="white"/>
            <text x="176" y="150" font-family="Inter" font-size="5.5" font-weight="700" fill="#1C1E21">EXP 2028</text>
            <text x="114" y="158" font-family="Inter" font-size="6.5" fill="#1C1E21" opacity="0.7">H2S-2026-001 · EXP: 2028-12-31</text>
          </svg>
        </div>
      </section>

      <!-- How it works -->
      <section id="how" class="bg-white border-y border-line">
        <div class="max-w-6xl mx-auto px-6 py-16">
          <h2 class="font-display font-bold text-2xl mb-10">How it works</h2>
          <div class="grid md:grid-cols-5 gap-6">
            <template x-for="(s,i) in [
              {t:'Wear', d:'Worker wears the badge for the full shift.', icon:'hand'},
              {t:'Exposure', d:'The sensing strip reacts to ambient H₂S over time.', icon:'flask-conical'},
              {t:'Scan', d:'Photograph the badge with a phone at shift end.', icon:'scan-line'},
              {t:'Quantify', d:'Color response is converted to a calibrated dose.', icon:'sliders-horizontal'},
              {t:'Record', d:'The estimate is logged to the worker\'s history.', icon:'database'},
            ]">
              <div>
                <div class="w-10 h-10 rounded-lg bg-paper border border-line flex items-center justify-center mb-4">
                  <i :data-lucide="s.icon" class="w-5 h-5 text-amber-500"></i>
                </div>
                <p class="font-semibold text-sm mb-1" x-text="(i+1)+'. '+s.t"></p>
                <p class="text-sm text-ink/60 leading-relaxed" x-text="s.d"></p>
              </div>
            </template>
          </div>
        </div>
      </section>

      <!-- Why -->
      <section id="why" class="max-w-6xl mx-auto px-6 py-16">
        <h2 class="font-display font-bold text-2xl mb-10">Why H₂S-Track</h2>
        <div class="grid sm:grid-cols-3 gap-4">
          <template x-for="f in ['Battery-free','Passive','Disposable','Smartphone-readable','Batch-calibrated','Validity-aware']">
            <div class="rounded-xl border border-line bg-white p-5 shadow-card">
              <p class="font-semibold text-sm" x-text="f"></p>
            </div>
          </template>
        </div>
        <p class="font-display font-semibold text-xl mt-14 max-w-lg">From chemical response to digital insight.</p>
      </section>

      <footer class="border-t border-line">
        <div class="max-w-6xl mx-auto px-6 py-8 flex items-center justify-between text-xs text-ink/50">
          <span>H₂S-Track is a passive exposure dosimeter, not an emergency gas alarm. Use certified real-time detection equipment for immediate hazard alerts.</span>
        </div>
      </footer>
    </div>
  </template>

  <!-- ============ LOGIN ============ -->
  <template x-if="view==='login'">
    <div class="min-h-screen flex items-center justify-center bg-paper px-6">
      <div class="w-full max-w-sm">
        <div class="flex items-center gap-2.5 justify-center mb-8">
          <svg width="26" height="26" viewBox="0 0 30 30"><path d="M3 21 Q 10 9, 15 15 T 27 9" stroke="#F0C419" stroke-width="3.4" fill="none" stroke-linecap="round"/></svg>
          <span class="font-display font-extrabold text-lg">H₂S-Track</span>
        </div>
        <div class="bg-white border border-line rounded-xl shadow-card p-6">
          <p class="font-display font-bold text-lg mb-1">Sign in</p>
          <p class="text-sm text-ink/60 mb-5">Access your site's exposure records.</p>
          <label class="text-xs font-semibold text-ink/60">Work email</label>
          <input type="email" placeholder="you@site.com" class="w-full mt-1 mb-4 rounded-lg border border-line px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-yellow-DEFAULT">
          <label class="text-xs font-semibold text-ink/60">Password</label>
          <input type="password" placeholder="••••••••" class="w-full mt-1 mb-5 rounded-lg border border-line px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-yellow-DEFAULT">
          <button @click="view='home'" class="w-full rounded-lg bg-ink text-white font-semibold py-2.5 text-sm hover:bg-black transition">Sign in</button>
        </div>
        <button @click="view='landing'" class="text-xs text-ink/50 mt-5 mx-auto block hover:text-ink">← Back to site</button>
      </div>
    </div>
  </template>

  <!-- ============ APP SHELL (home / scan / result / history / officer / badges / alerts) ============ -->
  <template x-if="['home','scan','result','history','officer','badges','alerts'].includes(view)">
    <div class="min-h-screen md:flex">

      <!-- Desktop sidebar -->
      <aside class="hidden md:flex md:flex-col md:w-60 md:shrink-0 border-r border-line bg-white px-4 py-6">
        <div class="flex items-center gap-2.5 px-2 mb-8">
          <svg width="26" height="26" viewBox="0 0 30 30"><path d="M3 21 Q 10 9, 15 15 T 27 9" stroke="#F0C419" stroke-width="3.4" fill="none" stroke-linecap="round"/></svg>
          <span class="font-display font-extrabold text-base">H₂S-Track</span>
        </div>
        <nav class="flex flex-col gap-1 text-sm">
          <template x-for="item in role==='worker' ? navWorker : navOfficer">
            <button @click="view=item.v" class="flex items-center gap-2.5 px-3 py-2.5 rounded-lg font-medium text-left transition"
              :class="view===item.v ? 'bg-yellow-DEFAULT/25 text-ink' : 'text-ink/60 hover:bg-paper hover:text-ink'">
              <i :data-lucide="item.icon" class="w-4 h-4"></i> <span x-text="item.label"></span>
            </button>
          </template>
        </nav>
        <div class="mt-auto pt-6 border-t border-line">
          <button @click="role = role==='worker' ? 'officer' : 'worker'; view='home'" class="text-xs text-ink/50 hover:text-ink px-3">Switch to <span x-text="role==='worker' ? 'Safety Officer' : 'Worker'"></span> view</button>
        </div>
      </aside>

      <!-- Main column -->
      <div class="flex-1 min-w-0 pb-24 md:pb-8">

        <!-- ===== HOME (worker) ===== -->
        <template x-if="view==='home' && role==='worker'">
          <div class="max-w-2xl mx-auto px-5 pt-8 md:pt-10">
            <p class="text-sm text-ink/60">Good morning, <span class="font-semibold text-ink">Ramesh</span></p>
            <div class="flex items-center gap-4 text-xs text-ink/50 mt-1 mb-6">
              <span>Site: <span class="font-medium text-ink/70">Panvel Gas Terminal</span></span>
              <span>·</span>
              <span>Shift: <span class="font-medium text-ink/70">08:00–16:00</span></span>
            </div>

            <!-- Hero exposure card -->
            <div class="rounded-2xl border border-line bg-white shadow-card overflow-hidden mb-5">
              <div class="grain-band px-6 pt-6 pb-5" style="background:linear-gradient(180deg,#FBF7EE, #FFFFFF)">
                <p class="text-xs font-semibold text-ink/50 mb-2">Your latest exposure</p>
                <div class="flex items-end gap-2">
                  <span class="font-display font-extrabold text-5xl tracking-tight num-tabular">12.7</span>
                  <span class="text-sm font-medium text-ink/50 mb-1.5">ppm·h</span>
                </div>
                <p class="text-xs text-ink/50 mt-1">Estimated cumulative H₂S exposure</p>
                <span class="inline-flex items-center gap-1.5 mt-3 bg-go-bg text-go text-xs font-semibold px-2.5 py-1 rounded-md">
                  <i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i> WITHIN CALIBRATED RANGE
                </span>
              </div>
              <!-- meter -->
              <div class="px-6 py-5 border-t border-line">
                <div class="relative h-2.5 rounded-full overflow-hidden" style="background:linear-gradient(90deg, #E1F0E5, #B5C4AA, #8C846D, #595244, #262420)">
                  <div class="absolute top-1/2 -translate-y-1/2 w-3 h-3 rounded-full bg-white border-2 border-ink" style="left:5.3%"></div>
                </div>
                <div class="flex justify-between text-[11px] text-ink/45 mt-1.5">
                  <span>0 ppm·h</span><span>240 ppm·h</span>
                </div>
              </div>
              <div class="grid grid-cols-2 gap-px bg-line border-t border-line text-xs">
                <div class="bg-white px-5 py-3"><p class="text-ink/45">Badge ID</p><p class="font-semibold mt-0.5">H2S-001</p></div>
                <div class="bg-white px-5 py-3"><p class="text-ink/45">Batch</p><p class="font-semibold mt-0.5">H2S-2026-001</p></div>
                <div class="bg-white px-5 py-3"><p class="text-ink/45">Shift</p><p class="font-semibold mt-0.5">08:00–16:00</p></div>
                <div class="bg-white px-5 py-3"><p class="text-ink/45">Scan time</p><p class="font-semibold mt-0.5">16:08</p></div>
              </div>
            </div>

            <button @click="startScan()" class="w-full flex items-center justify-center gap-2 rounded-xl bg-ink text-white font-semibold py-4 mb-8 hover:bg-black transition">
              <i data-lucide="scan-line" class="w-4 h-4"></i> Scan your badge
            </button>

            <div class="flex items-center justify-between mb-3">
              <p class="font-display font-bold text-sm">Recent history</p>
              <button @click="view='history'" class="text-xs font-semibold text-amber-500">See all</button>
            </div>
            <div class="space-y-2">
              <template x-for="r in history.slice(0,3)" :key="r.date">
                <div class="flex items-center justify-between bg-white border border-line rounded-xl px-4 py-3">
                  <div>
                    <p class="text-sm font-semibold" x-text="r.date"></p>
                    <p class="text-xs text-ink/45" x-text="r.shift"></p>
                  </div>
                  <p class="font-display font-bold text-sm num-tabular" x-text="r.dose+' ppm·h'"></p>
                </div>
              </template>
            </div>
          </div>
        </template>

        <!-- ===== SCAN ===== -->
        <template x-if="view==='scan'">
          <div class="relative h-screen md:h-[calc(100vh-0px)] bg-black overflow-hidden text-white flex flex-col">
            <div class="flex items-center justify-between px-5 pt-5 z-10">
              <button @click="view='home'" class="w-9 h-9 rounded-full bg-white/10 flex items-center justify-center backdrop-blur"><i data-lucide="x" class="w-4 h-4"></i></button>
              <p class="font-semibold text-sm">Scan H₂S-Track Badge</p>
              <button class="w-9 h-9 rounded-full bg-white/10 flex items-center justify-center backdrop-blur"><i data-lucide="zap" class="w-4 h-4"></i></button>
            </div>

            <div class="flex-1 relative flex items-center justify-center">
              <!-- mock camera background -->
              <div class="absolute inset-0" style="background:radial-gradient(circle at 50% 40%, #2a2a2d, #0a0a0c 75%)"></div>
              <div class="scan-frame relative w-[78%] max-w-xs aspect-[3/2]">
                <span class="corner top-0 left-0 border-t-[3px] border-l-[3px] rounded-tl-lg"></span>
                <span class="corner top-0 right-0 border-t-[3px] border-r-[3px] rounded-tr-lg"></span>
                <span class="corner bottom-0 left-0 border-b-[3px] border-l-[3px] rounded-bl-lg"></span>
                <span class="corner bottom-0 right-0 border-b-[3px] border-r-[3px] rounded-br-lg"></span>
                <p class="absolute -bottom-9 left-0 right-0 text-center text-[11px] tracking-wide text-yellow-DEFAULT font-semibold">ALIGN BADGE HERE</p>
              </div>
            </div>

            <!-- scanning stages -->
            <div class="relative z-10 px-5 pb-8 pt-3">
              <div class="space-y-2.5 mb-5">
                <template x-for="(stg,i) in scanStages" :key="stg.label">
                  <div class="flex items-center gap-2.5 text-sm">
                    <div class="w-5 h-5 rounded-full flex items-center justify-center shrink-0 transition"
                      :class="scanStep > i ? 'bg-go' : (scanStep===i ? 'bg-yellow-DEFAULT' : 'bg-white/10')">
                      <i x-show="scanStep > i" data-lucide="check" class="w-3 h-3 text-white"></i>
                      <div x-show="scanStep===i" class="w-2 h-2 rounded-full bg-black animate-pulse"></div>
                    </div>
                    <span :class="scanStep >= i ? 'text-white' : 'text-white/35'" x-text="stg.label"></span>
                  </div>
                </template>
              </div>
              <button x-show="!scanning && scanStep===0" @click="runScan()" class="w-full rounded-xl bg-yellow-DEFAULT text-ink font-semibold py-3.5">Capture</button>
              <p x-show="scanning" class="text-center text-xs text-white/50">Analyzing badge…</p>
            </div>
          </div>
        </template>

        <!-- ===== RESULT ===== -->
        <template x-if="view==='result'">
          <div class="max-w-2xl mx-auto px-5 pt-8">
            <p class="text-xs font-semibold text-ink/45 mb-1">ESTIMATED EXPOSURE</p>
            <div class="flex items-end gap-2 mb-4">
              <span class="font-display font-extrabold text-5xl num-tabular">12.7</span>
              <span class="text-sm font-medium text-ink/50 mb-1.5">ppm·h</span>
            </div>

            <div class="rounded-2xl border border-line bg-white shadow-card divide-y divide-line mb-5">
              <div class="px-5 py-4 flex items-center justify-between">
                <div>
                  <p class="text-xs text-ink/45 mb-1.5">Sensor response</p>
                  <div class="w-14 h-8 rounded-md border border-line" style="background:#8A5A2A"></div>
                </div>
                <div>
                  <p class="text-xs text-ink/45 mb-1.5">Reference scale</p>
                  <div class="flex rounded-md overflow-hidden border border-line w-32 h-8">
                    <div class="flex-1" style="background:#E1F0E5"></div><div class="flex-1" style="background:#B5C4AA"></div>
                    <div class="flex-1" style="background:#8C846D"></div><div class="flex-1" style="background:#595244"></div>
                    <div class="flex-1" style="background:#262420"></div>
                  </div>
                </div>
              </div>
              <div class="px-5 py-4 flex items-center justify-between">
                <span class="text-sm font-medium">Validity</span>
                <span class="inline-flex items-center gap-1.5 bg-go-bg text-go text-xs font-semibold px-2.5 py-1 rounded-md"><i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i> VALID</span>
              </div>
              <div class="grid grid-cols-2 text-sm">
                <div class="px-5 py-3.5 border-r border-line"><p class="text-xs text-ink/45">Badge</p><p class="font-semibold mt-0.5">H2S-001</p></div>
                <div class="px-5 py-3.5"><p class="text-xs text-ink/45">Batch</p><p class="font-semibold mt-0.5">H2S-2026-09</p></div>
                <div class="px-5 py-3.5 border-r border-t border-line"><p class="text-xs text-ink/45">Worker</p><p class="font-semibold mt-0.5">W-027</p></div>
                <div class="px-5 py-3.5 border-t border-line"><p class="text-xs text-ink/45">Shift</p><p class="font-semibold mt-0.5">08:00–16:00</p></div>
                <div class="px-5 py-3.5 border-r border-t border-line"><p class="text-xs text-ink/45">Scan quality</p><p class="font-semibold mt-0.5 text-go">Good</p></div>
                <div class="px-5 py-3.5 border-t border-line"><p class="text-xs text-ink/45">Calibration</p><p class="font-semibold mt-0.5">C17</p></div>
              </div>
            </div>

            <p class="text-xs text-ink/40 mb-6 leading-relaxed">Estimate derived from calibrated colorimetric response (curve C17, ±1.4 ppm·h uncertainty). Not a substitute for certified real-time gas detection.</p>

            <div class="flex flex-col gap-2.5 mb-10">
              <button @click="view='home'" class="w-full rounded-xl bg-ink text-white font-semibold py-3.5">Save exposure record</button>
              <button @click="startScan()" class="w-full rounded-xl border border-line bg-white font-semibold py-3.5">Scan again</button>
            </div>
          </div>
        </template>

        <!-- ===== HISTORY ===== -->
        <template x-if="view==='history'">
          <div class="max-w-3xl mx-auto px-5 pt-8">
            <p class="font-display font-bold text-xl mb-1">Exposure history</p>
            <p class="text-sm text-ink/50 mb-5">Ramesh Kadam · W-027</p>

            <div class="flex gap-2 mb-5">
              <template x-for="rng in ['Weekly','Monthly','Custom']">
                <button @click="rangeFilter=rng" class="text-xs font-semibold px-3 py-1.5 rounded-full border transition"
                  :class="rangeFilter===rng ? 'bg-ink text-white border-ink' : 'border-line text-ink/60'" x-text="rng"></button>
              </template>
            </div>

            <div class="rounded-2xl border border-line bg-white shadow-card p-5 mb-6">
              <canvas id="historyChart" height="130"></canvas>
            </div>

            <div class="space-y-2">
              <template x-for="r in history" :key="r.date">
                <div class="flex items-center justify-between bg-white border border-line rounded-xl px-4 py-3.5">
                  <div>
                    <p class="text-sm font-semibold" x-text="r.date"></p>
                    <p class="text-xs text-ink/45" x-text="r.shift + ' · Badge ' + r.badge"></p>
                  </div>
                  <p class="font-display font-bold text-sm num-tabular" x-text="r.dose+' ppm·h'"></p>
                </div>
              </template>
            </div>
          </div>
        </template>

        <!-- ===== OFFICER DASHBOARD ===== -->
        <template x-if="view==='home' && role==='officer'">
          <div class="max-w-5xl mx-auto px-5 pt-8">
            <p class="font-display font-bold text-xl mb-1">Overview</p>
            <p class="text-sm text-ink/50 mb-6">Panvel Gas Terminal · Today</p>

            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
              <template x-for="s in officerStats">
                <div class="bg-white border border-line rounded-xl px-4 py-4">
                  <p class="text-xs text-ink/45 mb-1.5" x-text="s.label"></p>
                  <p class="font-display font-bold text-2xl" x-text="s.value"></p>
                </div>
              </template>
            </div>

            <div class="grid md:grid-cols-5 gap-5 mb-6">
              <div class="md:col-span-3 bg-white border border-line rounded-2xl shadow-card p-5">
                <p class="text-sm font-semibold mb-4">Exposure trend</p>
                <canvas id="officerChart" height="140"></canvas>
              </div>
              <div class="md:col-span-2 bg-white border border-line rounded-2xl shadow-card p-5">
                <p class="text-sm font-semibold mb-4">Workers requiring review</p>
                <div class="space-y-3">
                  <template x-for="w in reviewList">
                    <div class="flex items-start gap-2.5">
                      <div class="w-6 h-6 rounded-full flex items-center justify-center shrink-0 mt-0.5"
                        :class="w.sev==='Critical' ? 'bg-bad-bg' : 'bg-warn-bg'">
                        <i data-lucide="alert-triangle" class="w-3.5 h-3.5" :class="w.sev==='Critical' ? 'text-bad' : 'text-warn'"></i>
                      </div>
                      <div>
                        <p class="text-sm font-semibold" x-text="w.name"></p>
                        <p class="text-xs text-ink/50" x-text="w.reason"></p>
                      </div>
                    </div>
                  </template>
                </div>
              </div>
            </div>
          </div>
        </template>

        <!-- ===== BADGES (officer) ===== -->
        <template x-if="view==='badges'">
          <div class="max-w-4xl mx-auto px-5 pt-8">
            <p class="font-display font-bold text-xl mb-5">Badges</p>
            <div class="bg-white border border-line rounded-2xl shadow-card overflow-hidden">
              <table class="w-full text-sm">
                <thead>
                  <tr class="text-left text-xs text-ink/45 border-b border-line">
                    <th class="px-4 py-3 font-medium">Badge ID</th>
                    <th class="px-4 py-3 font-medium">Batch</th>
                    <th class="px-4 py-3 font-medium">Assigned</th>
                    <th class="px-4 py-3 font-medium">Status</th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="b in badges" :key="b.id">
                    <tr class="border-b border-line last:border-0">
                      <td class="px-4 py-3 font-semibold" x-text="b.id"></td>
                      <td class="px-4 py-3 text-ink/60" x-text="b.batch"></td>
                      <td class="px-4 py-3 text-ink/60" x-text="b.worker"></td>
                      <td class="px-4 py-3">
                        <span class="text-xs font-semibold px-2 py-1 rounded-md"
                          :class="{
                            'bg-go-bg text-go': b.status==='In Use' || b.status==='Available',
                            'bg-warn-bg text-warn': b.status==='Scanned',
                            'bg-bad-bg text-bad': b.status==='Expired'
                          }" x-text="b.status"></span>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </div>
        </template>

        <!-- ===== ALERTS ===== -->
        <template x-if="view==='alerts'">
          <div class="max-w-2xl mx-auto px-5 pt-8">
            <p class="font-display font-bold text-xl mb-5">Alerts</p>
            <div class="space-y-2.5">
              <template x-for="a in alerts">
                <div class="bg-white border border-line rounded-xl px-4 py-3.5 flex items-start gap-3">
                  <div class="w-7 h-7 rounded-full flex items-center justify-center shrink-0"
                    :class="{'bg-bad-bg text-bad': a.sev==='Critical','bg-warn-bg text-warn': a.sev==='Warning','bg-go-bg text-go': a.sev==='Attention','bg-paper text-ink/50': a.sev==='Info'}">
                    <i data-lucide="bell" class="w-3.5 h-3.5"></i>
                  </div>
                  <div class="flex-1">
                    <p class="text-sm font-semibold" x-text="a.title"></p>
                    <p class="text-xs text-ink/50 mt-0.5" x-text="a.detail"></p>
                  </div>
                  <span class="text-[10px] font-semibold text-ink/35 mt-1" x-text="a.time"></span>
                </div>
              </template>
            </div>
          </div>
        </template>

      </div>

      <!-- Mobile bottom nav -->
      <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-line px-2 pt-2 pb-[calc(0.5rem+env(safe-area-inset-bottom))] flex justify-around z-20">
        <template x-for="item in role==='worker' ? navWorkerMobile : navOfficerMobile">
          <button @click="item.v==='scan' ? startScan() : view=item.v" class="flex flex-col items-center gap-1 px-3 py-1 rounded-lg"
            :class="view===item.v ? 'text-ink' : 'text-ink/40'">
            <i :data-lucide="item.icon" class="w-5 h-5"></i>
            <span class="text-[10px] font-semibold" x-text="item.label"></span>
          </button>
        </template>
      </nav>
    </div>
  </template>

</div>

<script>
function app(){
  return {
    view: 'landing',
    role: 'worker',
    rangeFilter: 'Weekly',
    scanning: false,
    scanStep: 0,
    scanStages: [
      {label:'Badge detected'},
      {label:'QR detected'},
      {label:'Sensor region detected'},
      {label:'Reference scale detected'},
      {label:'Validity checked'},
      {label:'Image quality checked'},
      {label:'Exposure estimated'},
    ],
    navWorker: [
      {v:'home', label:'Home', icon:'home'},
      {v:'scan', label:'Scan', icon:'scan-line'},
      {v:'history', label:'History', icon:'line-chart'},
      {v:'alerts', label:'Alerts', icon:'bell'},
    ],
    navWorkerMobile: [
      {v:'home', label:'Home', icon:'home'},
      {v:'scan', label:'Scan', icon:'scan-line'},
      {v:'history', label:'History', icon:'line-chart'},
      {v:'alerts', label:'Alerts', icon:'bell'},
    ],
    navOfficer: [
      {v:'home', label:'Overview', icon:'layout-dashboard'},
      {v:'scan', label:'Scan Badge', icon:'scan-line'},
      {v:'badges', label:'Badges', icon:'credit-card'},
      {v:'history', label:'Exposure Records', icon:'line-chart'},
      {v:'alerts', label:'Alerts', icon:'bell'},
    ],
    navOfficerMobile: [
      {v:'home', label:'Overview', icon:'layout-dashboard'},
      {v:'scan', label:'Scan', icon:'scan-line'},
      {v:'badges', label:'Badges', icon:'credit-card'},
      {v:'alerts', label:'Alerts', icon:'bell'},
    ],
    history: [
      {date:'24 Nov', shift:'08:00–16:00', badge:'H2S-001', dose:12.7},
      {date:'23 Nov', shift:'08:00–16:00', badge:'H2S-097', dose:8.2},
      {date:'22 Nov', shift:'08:00–16:00', badge:'H2S-088', dose:15.4},
      {date:'21 Nov', shift:'00:00–08:00', badge:'H2S-071', dose:6.1},
      {date:'20 Nov', shift:'08:00–16:00', badge:'H2S-063', dose:9.9},
    ],
    officerStats: [
      {label:'Total workers', value:'142'},
      {label:'Active badges', value:'118'},
      {label:'Scans today', value:'96'},
      {label:'Invalid scans', value:'3'},
    ],
    reviewList: [
      {name:'Suresh Patil · W-014', reason:'Repeated elevated exposure', sev:'Critical'},
      {name:'Amit Joshi · W-062', reason:'Invalid badge on last scan', sev:'Warning'},
      {name:'Farhan Sheikh · W-039', reason:'Poor scan quality', sev:'Warning'},
    ],
    badges: [
      {id:'H2S-001', batch:'H2S-2026-001', worker:'W-027 Ramesh K.', status:'In Use'},
      {id:'H2S-002', batch:'H2S-2026-001', worker:'W-014 Suresh P.', status:'Scanned'},
      {id:'H2S-003', batch:'H2S-2026-001', worker:'—', status:'Available'},
      {id:'H2S-071', batch:'H2S-2026-002', worker:'W-039 Farhan S.', status:'Expired'},
    ],
    alerts: [
      {title:'Repeated elevated exposure — requires review', detail:'W-014 Suresh Patil · 3 shifts above review threshold', sev:'Critical', time:'2h ago'},
      {title:'Badge validity uncertain', detail:'Badge H2S-071 · control patch response out of range', sev:'Warning', time:'5h ago'},
      {title:'Poor image quality', detail:'W-039 Farhan Sheikh · scan retry recommended', sev:'Attention', time:'6h ago'},
      {title:'Badge expired', detail:'Badge H2S-055 · past validated shelf life', sev:'Info', time:'1d ago'},
    ],
    init(){
      this.$watch('view', () => this.$nextTick(() => { this.renderIcons(); this.renderCharts(); }));
      this.$watch('role', () => this.$nextTick(() => this.renderIcons()));
      this.renderIcons();
    },
    renderIcons(){ if(window.lucide) lucide.createIcons(); },
    startScan(){
      this.view = 'scan';
      this.scanStep = 0;
      this.scanning = false;
      this.$nextTick(()=>this.renderIcons());
    },
    runScan(){
      this.scanning = true;
      let i = 0;
      const t = setInterval(() => {
        i++;
        this.scanStep = i;
        if(i >= this.scanStages.length){
          clearInterval(t);
          setTimeout(()=>{ this.view='result'; this.scanning=false; this.$nextTick(()=>this.renderIcons()); }, 400);
        }
      }, 420);
    },
    renderCharts(){
      const labels = this.history.map(h=>h.date).reverse();
      const data = this.history.map(h=>h.dose).reverse();
      ['historyChart','officerChart'].forEach(id=>{
        const el = document.getElementById(id);
        if(!el) return;
        if(el._chart) el._chart.destroy();
        el._chart = new Chart(el, {
          type:'line',
          data:{ labels, datasets:[{
            data,
            borderColor:'#8A5A2A',
            backgroundColor:'rgba(138,90,42,0.08)',
            fill:true, tension:0.35, pointRadius:3,
            pointBackgroundColor:'#8A5A2A',
            borderWidth:2,
          }]},
          options:{
            plugins:{legend:{display:false}},
            scales:{
              y:{ grid:{color:'#EFE3D0'}, ticks:{color:'#8A8A8E', font:{size:10}} },
              x:{ grid:{display:false}, ticks:{color:'#8A8A8E', font:{size:10}} }
            }
          }
        });
      });
    }
  }
}
</script>
</body>
</html>
