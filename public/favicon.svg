<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <radialGradient id="sulfurGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="85%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </radialGradient>
    <radialGradient id="hydrogenGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="85%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </radialGradient>
    <linearGradient id="bondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="meshGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#FCD34D" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect x="4" y="4" width="112" height="112" rx="28" fill="#0F172A" stroke="#F59E0B" stroke-width="2.5"/>

  <!-- Van der Waals Electron Cloud Mesh -->
  <g stroke="url(#meshGrad)" stroke-width="0.8" fill="none" opacity="0.85">
    <ellipse cx="60" cy="62" rx="46" ry="38" transform="rotate(-15 60 62)"/>
    <ellipse cx="60" cy="62" rx="42" ry="32" transform="rotate(25 60 62)"/>
    <ellipse cx="60" cy="62" rx="36" ry="44" transform="rotate(-55 60 62)"/>
    <ellipse cx="42" cy="38" rx="20" ry="16" transform="rotate(-20 42 38)"/>
    <ellipse cx="85" cy="52" rx="20" ry="16" transform="rotate(30 85 52)"/>
    <path d="M20,62 Q40,30 60,35 Q80,40 102,54"/>
    <path d="M24,75 Q45,45 60,48 Q75,50 98,72"/>
    <path d="M30,48 Q60,25 90,40"/>
    <path d="M35,88 Q60,65 85,82"/>
    <path d="M38,28 Q48,58 42,90"/>
    <path d="M60,24 Q62,60 58,98"/>
    <path d="M82,35 Q78,65 80,92"/>
    <path d="M28,40 L45,88 L85,92 L98,58 L78,28 L42,28 Z"/>
    <path d="M42,28 L60,48 L78,28 M45,88 L60,62 L85,92 M28,40 L60,62 L98,58"/>
  </g>

  <!-- Chemical Bonds -->
  <line x1="60" y1="65" x2="42" y2="38" stroke="url(#bondGrad)" stroke-width="7" stroke-linecap="round"/>
  <line x1="60" y1="65" x2="85" y2="52" stroke="url(#bondGrad)" stroke-width="7" stroke-linecap="round"/>

  <!-- Hydrogen Atom 1 -->
  <circle cx="42" cy="38" r="12" fill="url(#hydrogenGrad)" stroke="#334155" stroke-width="1"/>
  <circle cx="38" cy="34" r="3" fill="#FFFFFF" opacity="0.85"/>

  <!-- Hydrogen Atom 2 -->
  <circle cx="85" cy="52" r="12" fill="url(#hydrogenGrad)" stroke="#334155" stroke-width="1"/>
  <circle cx="81" cy="48" r="3" fill="#FFFFFF" opacity="0.85"/>

  <!-- Central Sulfur Atom -->
  <circle cx="60" cy="65" r="18" fill="url(#sulfurGrad)" stroke="#78350F" stroke-width="1.2" filter="url(#glow)"/>
  <circle cx="54" cy="59" r="4.5" fill="#FFFBEB" opacity="0.85"/>
  <circle cx="52" cy="57" r="2" fill="#FFFFFF" opacity="0.95"/>
</svg>